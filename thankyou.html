<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank you</title>
    
    <!-- แทรกสไตล์เพื่อปรับปรุงหน้านี้ให้ดูดีขึ้น -->
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #fcece8; /* สีพื้นหลังโทนเดียวกับรูป */
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      /* สไตล์สำหรับกล่องขอบคุณ */
      #thankyou {
        color: #f7a7ac;
        font-size: 3rem;
        font-weight: bold;
        margin-top: 20px;
        margin-bottom: 30px;
      }

      /* สไตล์สำหรับปรับปรุงรูปภาพให้สมส่วน */
      #rizz.responsive {
        width: 100%;
        max-width: 450px; /* กำหนดขนาดความกว้างสูงสุด */
        height: auto;
        border-radius: 20px; /* เพิ่มขอบมนให้น่ารัก */
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); /* เพิ่มเงา */
        margin-bottom: 40px;
        aspect-ratio: 16/11; /* กำหนดอัตราส่วนภาพตามจริง */
        object-fit: contain; /* ให้ภาพจัดวางอย่างสมส่วนในกรอบ */
      }

      /* สไตล์สำหรับปุ่ม */
      .button {
        background-color: #f7a7ac;
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 1.2rem;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        transition: transform 0.2s ease, background-color 0.2s ease;
        box-shadow: 0 5px 15px rgba(247, 167, 172, 0.4);
        margin-bottom: 20px;
      }

      .button:hover {
        background-color: #f38f95;
        transform: scale(1.05); /* เพิ่มลูกเล่นขยายขนาดตอนเอาเมาส์ไปวาง */
      }
    </style>
  </head>
  <body>
    <div id="thankyou"><b>Thank you ❤️</b></div>

    <!-- เรียกชื่อไฟล์ตรงๆ alisa.jpeg ใน GitHub -->
    <img id="rizz" src="alisa.jpeg" alt="Alisa" class="responsive" />

    <button class="button" onclick="location.href='index.html'">
      Click me UWU
    </button>
  </body>
</html>
