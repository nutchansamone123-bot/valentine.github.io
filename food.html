<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Selection</title>
    <link rel="stylesheet" href="css/food.css" />
  </head>
  <body>
    <div id="foodquestion">
      <b>What food would you like to eat?</b>
    </div>

    
      <div class="food-item">
        <img src="1.jpeg" alt="pasta" />
        <label><input type="checkbox" name="food" value="pasta" /> ກຸ້ງເຊນ້ຳປາາາ</label>
      </div>
      <div class="food-item">
        <img src="2.jpeg" alt="pizza" />
        <label><input type="checkbox" name="food" value="pizza" /> ເຝີເຮືອອອອ</label>
      </div>
      <div class="food-item">
        <img src="3.jpeg" alt="salad" />
        <label><input type="checkbox" name="food" value="salad" /> ເຂົ້າມັນໄກ່</label>
      </div>
      <div class="food-item">
        <img src="4.jpeg" alt="steak" />
        <label><input type="checkbox" name="food" value="steak" /> ຊີ້ນດາດດດ</label>
      </div>
    </div>
    <button class="button" onclick="location.href='dessert.html'">
      Continue UWU
    </button>
  </body>
</html>
